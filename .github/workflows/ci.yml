name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vendora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d vendora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the CI service containers only.
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/vendora_test
      TEST_REDIS_URL: redis://localhost:6379/1
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w backend
      - run: npm test -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w frontend
      - run: npm run build -w frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vendora_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d vendora_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ['1025:1025', '8025:8025']
    env:
      # Throwaway credentials for the CI service containers only.
      E2E_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/vendora_e2e
      E2E_REDIS_URL: redis://localhost:6379/2
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not just the last commit
      - name: Scan every commit for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  production-stack:
    # Builds the production images and runs docker-compose.prod.yml as a server would, then
    # checks it from outside with the smoke tests (npm run smoke).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Settings for a throwaway stack on localhost
        run: |
          cp .env.production.example .env.production
          sed -i \
            -e 's#^SITE_ADDRESS=.*#SITE_ADDRESS=localhost#' \
            -e 's#^APP_URL=.*#APP_URL=https://localhost:8443#' \
            -e 's#^CORS_ORIGINS=.*#CORS_ORIGINS=https://localhost:8443#' \
            -e "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=$(openssl rand -hex 24)#" \
            -e "s#^REDIS_PASSWORD=.*#REDIS_PASSWORD=$(openssl rand -hex 24)#" \
            -e 's#^SMTP_URL=.*#SMTP_URL=smtp://localhost:2525#' \
            .env.production
          sed -i "s#^MFA_ENCRYPTION_KEY=.*#MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)#" .env.production
          printf 'HTTP_PORT=8080\nHTTPS_PORT=8443\n' >> .env.production
      - name: The production Compose file is valid
        run: docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
      - name: Build and start
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
      - name: Wait until ready
        run: |
          for i in $(seq 1 60); do
            if curl -skf https://localhost:8443/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml --env-file .env.production ps -a
          docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests against the running stack
        run: npm run smoke
        env:
          SMOKE_URL: https://localhost:8443
          SMOKE_INSECURE: '1'
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 200
