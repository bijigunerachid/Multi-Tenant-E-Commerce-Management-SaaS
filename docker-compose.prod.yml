# Production stack: one server running everything. See docs/deployment.md.
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only the web server is reachable from outside (ports 80 and 443). The API, worker, database
# and Redis talk on a private network. Migrations run once, before the API and worker start.
name: vendora-prod

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: vendora-api:${VENDORA_VERSION:-local}
  restart: unless-stopped
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    JOB_WORKER: separate
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: vendora-web:${VENDORA_VERSION:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  migrate:
    <<: *backend
    restart: 'no'
    command: ['node', '../node_modules/prisma/build/index.js', 'migrate', 'deploy']
    healthcheck:
      disable: true

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads

  worker:
    <<: *backend
    command: ['node', 'src/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The worker writes a heartbeat file every 30 s; stale for 90 s means it is stuck.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('fs').statSync('/tmp/vendora-worker-heartbeat');process.exit(Date.now()-s.mtimeMs<90000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}',
        '--maxmemory-policy',
        'noeviction',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
